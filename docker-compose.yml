# Self-hosting: app + Postgres + Redis. Copy .env.docker.example to .env, fill it in, then
# `docker compose up -d --build`. See "Self-hosting with Docker" in the README.
name: wallethistory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallethistory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wallethistory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallethistory -d wallethistory"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache only: no persistence, capped memory. Leave it out by setting REDIS_URL to empty on the app.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      # Migrations run in this container before the server starts.
      DATABASE_URL: postgres://wallethistory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/wallethistory
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-WalletHistory <noreply@example.com>}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Loopback by default; set APP_BIND=0.0.0.0 to reach it from your network (see the README).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
